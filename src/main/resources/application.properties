spring.application.name=yvideogen

# Spring AI - OpenAI Configuration
# IMPORTANT: Set your OpenAI API key via environment variable or system property
# export SPRING_AI_OPENAI_API_KEY=your_api_key_here
# Or set it in this file (NOT recommended for production):
# spring.ai.openai.api-key=YOUR_API_KEY_HERE
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-5.5
#spring.ai.openai.chat.options.temperature=1.0

# Google Drive Configuration
# Set the path to your Google Drive service account JSON file
# export GOOGLE_DRIVE_CREDENTIALS_FILE=/path/to/credentials.json
# Or set it in this file:
google.drive.credentials.file=${GOOGLE_DRIVE_CREDENTIALS_FILE:}

# Optional: Set the parent folder ID in Google Drive where files will be uploaded
# This should be the Google Drive folder ID where you want scenes to be saved
google.drive.folder.id=${GOOGLE_DRIVE_FOLDER_ID:}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.use-root-path=true

# Enable S3 storage service
aws.s3.enabled=true
aws.s3.bucket-name=yvideogen
aws.s3.region=us-west-2

