# Example S3 Configuration
# Copy these properties to your application.properties or application-local.properties
# and adjust the values for your AWS S3 setup

# ==========================================
# AWS S3 Storage Configuration
# ==========================================

# Enable S3 storage service
aws.s3.enabled=true

# S3 bucket name where scenes will be stored
aws.s3.bucket-name=my-video-scenes-bucket

# AWS region (optional, defaults to us-east-1)
aws.s3.region=us-east-1


# ==========================================
# AWS Credentials Configuration
# ==========================================

# Option 1: Using Environment Variables (Recommended for Production)
# Set these environment variables instead of putting them in properties file:
#
# export AWS_ACCESS_KEY_ID=your_access_key_id
# export AWS_SECRET_ACCESS_KEY=your_secret_access_key
# export AWS_SESSION_TOKEN=your_session_token (optional, for temporary credentials)
#
# This is the most secure method as credentials are not stored in code or config files


# Option 2: Using AWS Credentials File (~/.aws/credentials)
# AWS SDKv2 automatically reads from the default credentials file location:
#
# [default]
# aws_access_key_id=your_access_key_id
# aws_secret_access_key=your_secret_access_key
#
# Or with profile (set AWS_PROFILE environment variable):
# [my-profile]
# aws_access_key_id=your_access_key_id
# aws_secret_access_key=your_secret_access_key


# Option 3: IAM Roles (For EC2/ECS Deployment)
# If running on AWS EC2 or ECS, attach an IAM role with S3 access
# No credentials needed in configuration


# ==========================================
# S3 Bucket Policy Requirements
# ==========================================

# Your S3 bucket should allow the following operations:
# - s3:PutObject - To upload scenes
# - s3:GetObject - To retrieve files (optional, for retrieval features)
# - s3:ListBucket - To list objects (optional)

# Example bucket policy:
# {
#   "Version": "2012-10-17",
#   "Statement": [
#     {
#       "Effect": "Allow",
#       "Principal": {
#         "AWS": "arn:aws:iam::123456789012:user/your-user"
#       },
#       "Action": [
#         "s3:PutObject",
#         "s3:GetObject",
#         "s3:ListBucket"
#       ],
#       "Resource": [
#         "arn:aws:s3:::my-video-scenes-bucket",
#         "arn:aws:s3:::my-video-scenes-bucket/*"
#       ]
#     }
#   ]
# }


# ==========================================
# Additional Configuration Options
# ==========================================

# Server configuration for S3 uploads
# Configure timeouts if needed:
spring.mvc.async.request-timeout=300000

# Note: The application will create a "scenes/" prefix in your S3 bucket
# Example uploaded file path: s3://my-video-scenes-bucket/scenes/video_scenes_my_theme.txt


# ==========================================
# Fallback Configuration
# ==========================================

# Google Drive configuration is still used as fallback
# If S3 is not enabled or fails, the application falls back to Google Drive
google.drive.credentials.file=/path/to/drive_creds.json
google.drive.folder.id=optional_folder_id

